name: Build XCFrameworks

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'config/upstream.json'
      - 'config/xcode-versions.json'

permissions:
  contents: write

jobs:
  detect-changes:
    name: Detect what to build
    runs-on: macos-27
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Build matrix
        id: matrix
        run: echo "matrix=$(bash scripts/detect-changes.sh)" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.branch }} (Xcode ${{ matrix.xcode_version }})
    needs: detect-changes
    if: fromJSON(needs.detect-changes.outputs.matrix).include[0] != null
    runs-on: macos-27
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect-changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Build xcframeworks
        run: |
          bash scripts/build-xcframework.sh \
            "${{ matrix.branch }}" \
            "${{ matrix.sha }}" \
            "${{ matrix.xcode_app }}" \
            "./build-output/${{ matrix.branch }}/${{ matrix.xcode_version }}"

      - name: Package artifacts
        run: |
          bash scripts/package-release.sh \
            "./build-output/${{ matrix.branch }}/${{ matrix.xcode_version }}" \
            "./release-artifacts/${{ matrix.branch }}" \
            "${{ matrix.xcode_version }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.branch }}-xcode${{ matrix.xcode_version }}
          path: ./release-artifacts/${{ matrix.branch }}/
          retention-days: 5

  release:
    name: Publish release (${{ matrix.branch }})
    needs: [detect-changes, build]
    if: github.ref == 'refs/heads/main'
    runs-on: macos-27
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        branch: [community, master]
    steps:
      - uses: actions/checkout@v4

      - name: Read build info
        id: info
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="${{ matrix.branch }}"
          VERSION=$(jq -r --arg b "$BRANCH" '.branches[$b].last_built_version' config/upstream.json)
          SHA=$(jq -r --arg b "$BRANCH" '.branches[$b].last_built_sha' config/upstream.json)

          if [ -z "$SHA" ] || [ "$SHA" = "null" ]; then
            echo "No SHA configured for ${BRANCH} — skipping release"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Derive the build number from the releases that actually exist, not from
          # a counter in the checked-out upstream.json. Two overlapping runs both
          # read the same committed counter and compute the same tag, which fails
          # with "a release with the same tag name already exists".
          PREFIX="${BRANCH}-${VERSION}-build."
          LAST=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName \
            --jq "[.[].tagName | select(startswith(\"${PREFIX}\")) | ltrimstr(\"${PREFIX}\") | tonumber?] | max // 0")
          NEW_BUILD_NUM=$((LAST + 1))

          echo "Latest published build for ${PREFIX%.}: ${LAST} — next is ${NEW_BUILD_NUM}"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "build_number=${NEW_BUILD_NUM}" >> "$GITHUB_OUTPUT"
          echo "tag=${PREFIX}${NEW_BUILD_NUM}" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts for this branch
        if: steps.info.outputs.skip == 'false'
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ matrix.branch }}-*
          path: ./release-artifacts/
          merge-multiple: true

      - name: Check artifacts exist
        if: steps.info.outputs.skip == 'false'
        id: artifacts
        run: |
          if [ -f "./release-artifacts/checksums.json" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "No artifacts found for ${{ matrix.branch }} — skipping release"
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: steps.info.outputs.skip == 'false' && steps.artifacts.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/create-release.sh \
            "${{ matrix.branch }}" \
            "${{ steps.info.outputs.version }}" \
            "${{ steps.info.outputs.sha }}" \
            "${{ steps.info.outputs.tag }}" \
            "${{ steps.info.outputs.build_number }}" \
            "./release-artifacts" \
            "HamstringAssassin/realm-swift-xcframeworks"
